<body data-clic="sans-languette">
<div class="lc-decor" aria-hidden="true"><span class="lc-spark big t3" style="left:72%;top:12%;rotate:14deg"></span><span class="lc-spark t2 pk" style="left:86%;top:30%;rotate:-28deg;animation-delay:1.2s"></span><span class="lc-spark gr" style="left:8%;top:70%;rotate:38deg;animation-delay:2.1s"></span><span class="lc-spark" style="left:58%;top:6%;rotate:-10deg;animation-delay:.6s"></span></div>

    </div>
    <div class="a-card" id="aMission"></div>
  </section>

  <section class="a-deskwrap" aria-label="Ordinateur fictif de Marie">
    <div class="a-bezel">
      <div class="a-screen" id="aScreen">
        <div class="a-icons" id="aIcons"></div>
        <div class="a-windows" id="aWindows"></div>
        <div class="a-start" id="aStart" hidden></div>
        <div class="a-done" id="aDone" hidden></div>
        <div class="a-task" id="aTask">
          <div class="a-tb-wrap" id="aTb"></div>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>

  </section>
